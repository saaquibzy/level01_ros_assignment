amcl:
  ros__parameters:
    use_sim_time: true

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"

    scan_topic: "scan"
    laser_model_type: "likelihood_field"
    laser_max_range: 10.0
    laser_min_range: -1.0

    min_particles: 500
    max_particles: 2000

    update_min_d: 0.2
    update_min_a: 0.2
    resample_interval: 1

    transform_tolerance: 1.0
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    always_reset_initial_pose: false
    first_map_only: false

    set_initial_pose: false

    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    pf_err: 0.05
    pf_z: 0.99

    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1

    do_beamskip: false
